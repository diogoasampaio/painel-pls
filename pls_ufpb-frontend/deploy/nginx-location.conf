# Trecho a acrescentar no server{} ja existente em
# /etc/nginx/sites-available/painel-ufpb (o mesmo que atende /prpg-avaliacao).
# O Next.js do PLS roda na 3001 com basePath /painel-pls; a FastAPI do PLS
# (8001) nunca aparece aqui.

location /painel-pls {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
